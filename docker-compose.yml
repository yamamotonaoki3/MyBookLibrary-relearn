name: mybooklibrary-relearn
services:
  db:
    image: postgres:18.6
    container_name: mybooklibrary-db

    restart: unless-stopped

    shm_size: 128mb

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - mybooklibrary-db:/var/lib/postgresql
    ports:
      - 127.0.0.1:5432:5432

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  adminer:
    image: adminer
    restart: always
    ports:
      - 127.0.0.1:8080:8080

volumes:
  mybooklibrary-db:
